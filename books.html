<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مكتبة الكتب - دار اكتب للنشر والتوزيع</title>

<style>
*{box-sizing:border-box}

:root{
--bg:#171313;
--panel:#211a19;
--wine:#792632;
--gold:#e5c782;
--gold-light:#f4dfac;
--text:#fff5e8;
--muted:#c4b4a5;
}

body{
margin:0;
font-family:Tahoma,Arial,sans-serif;
background:var(--bg);
color:var(--text);
}

nav{
background:var(--panel);
padding:16px;
text-align:center;
border-bottom:1px solid rgba(229,199,130,.2);
}

nav a{
display:inline-block;
color:var(--gold-light);
text-decoration:none;
font-weight:bold;
margin:5px 12px;
}

nav a:hover{color:white}

.hero{
text-align:center;
padding:42px 18px;
background:linear-gradient(135deg,#211a19,#422027,#211a19);
border-bottom:1px solid rgba(229,199,130,.2);
}

.hero h1{
color:var(--gold-light);
font-size:34px;
margin:0 0 14px;
}

.hero p{
color:var(--muted);
line-height:1.9;
margin:0;
}

.container{
width:94%;
max-width:1250px;
margin:28px auto;
}

.controls{
display:grid;
grid-template-columns:2fr 1fr;
gap:12px;
margin-bottom:22px;
}

.controls input,.controls select{
width:100%;
padding:14px;
border:1px solid rgba(229,199,130,.3);
border-radius:9px;
background:var(--panel);
color:var(--text);
font-family:inherit;
font-size:15px;
outline:none;
}

.controls input:focus,.controls select:focus{
border-color:var(--gold);
}

.controls option{
background:var(--panel);
}

.results{
color:var(--muted);
margin-bottom:18px;
line-height:1.8;
}

.books-grid{
display:grid;
grid-template-columns:repeat(5,minmax(0,1fr));
gap:18px;
}

.book-card{
min-width:0;
background:var(--panel);
border:1px solid rgba(229,199,130,.17);
border-radius:12px;
overflow:hidden;
display:flex;
flex-direction:column;
transition:transform .2s,border-color .2s;
}

.book-card:hover{
transform:translateY(-4px);
border-color:var(--gold);
}

.cover-link{
display:block;
background:#302523;
height:245px;
padding:10px;
text-align:center;
}

.cover{
width:100%;
height:100%;
object-fit:contain;
border-radius:5px;
}

.book-info{
padding:13px;
display:flex;
flex-direction:column;
flex:1;
}

.book-title{
font-size:16px;
line-height:1.8;
color:var(--gold-light);
margin:0 0 8px;
overflow-wrap:anywhere;
}

.author{
font-size:13px;
color:var(--muted);
line-height:1.8;
margin:0 0 9px;
}

.category{
display:inline-block;
align-self:flex-start;
font-size:12px;
background:#382426;
color:var(--gold-light);
border-radius:20px;
padding:5px 9px;
margin-bottom:10px;
}

.price{
font-weight:bold;
color:var(--gold);
margin-top:auto;
padding:5px 0 12px;
}

.book-button{
display:block;
text-align:center;
text-decoration:none;
background:var(--wine);
color:white;
font-weight:bold;
padding:10px;
border-radius:7px;
margin-top:5px;
}

.book-button:hover{background:#963342}

.empty{
display:none;
text-align:center;
padding:35px 15px;
color:var(--muted);
background:var(--panel);
border-radius:10px;
line-height:2;
}

footer{
margin-top:45px;
padding:24px 15px;
text-align:center;
background:var(--panel);
color:var(--muted);
line-height:2;
border-top:1px solid rgba(229,199,130,.15);
}

@media(max-width:1050px){
.books-grid{grid-template-columns:repeat(4,minmax(0,1fr))}
}

@media(max-width:760px){
.hero h1{font-size:27px}
.books-grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.cover-link{height:190px;padding:7px}
.book-info{padding:9px}
.book-title{font-size:14px}
.author{font-size:12px}
.book-button{font-size:12px;padding:9px 5px}
}

@media(max-width:480px){
.controls{grid-template-columns:1fr}
.books-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
.cover-link{height:210px}
}
</style>
</head>

const grid = document.getElementById("booksGrid");
const searchInput = document.getElementById("search");
const categorySelect = document.getElementById("category");
const results = document.getElementById("results");
const empty = document.getElementById("empty");

function renderBooks(){
const query = searchInput.value.trim().toLowerCase();
const category = categorySelect.value;

const filtered = books.filter(book=>{
const matchesText =
book[1].toLowerCase().includes(query) ||
book[2].toLowerCase().includes(query);

const matchesCategory = !category || book[3] === category;

return matchesText && matchesCategory;
});

grid.innerHTML = "";
results.textContent = "عدد الكتب المعروضة: " + filtered.length;
empty.style.display = filtered.length ? "none" : "block";

filtered.forEach(book=>{
const card = document.createElement("article");
card.className = "book-card";

const coverLink = document.createElement("a");
coverLink.className = "cover-link";
coverLink.href = "book.html?book=" + book[0];
coverLink.setAttribute("aria-label","عرض تفاصيل " + book[1]);

const img = document.createElement("img");
img.className = "cover";
img.src = "images/book" + book[0] + ".jpg";
img.alt = book[1];
img.loading = "lazy";
img.onerror = function(){
this.onerror = null;
this.style.visibility = "hidden";
};

coverLink.appendChild(img);

const info = document.createElement("div");
info.className = "book-info";

const title = document.createElement("h2");
title.className = "book-title";
title.textContent = book[1];

const author = document.createElement("p");
author.className = "author";
author.textContent = "المؤلف: " + book[2];

const tag = document.createElement("span");
tag.className = "category";
tag.textContent = book[3];

const price = document.createElement("div");
price.className = "price";
price.textContent = book[4] == null
? "السعر عند التواصل"
: book[4] + " جنيه";

const button = document.createElement("a");
button.className = "book-button";
button.href = "book.html?book=" + book[0];
button.textContent = "عرض تفاصيل الكتاب";

info.append(title,author,tag,price,button);
card.append(coverLink,info);
grid.appendChild(card);
});
}

searchInput.addEventListener("input",renderBooks);
categorySelect.addEventListener("change",renderBooks);

renderBooks();
